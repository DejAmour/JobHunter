[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.1.0"
description = "Find jobs, screen them against your CV, apply on the employer's own form, and write to hiring teams."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]
indeed = ["python-jobspy>=1.1"]
cv = ["python-docx>=1.1", "pypdf>=5", "docx2pdf>=0.1", "pymupdf>=1.24", "pdfplumber>=0.11"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
