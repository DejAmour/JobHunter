<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Jobhunter{% endblock %}</title>
<style>
  /* A blotter, set like a printed page.
     The subject is an analyst's daily record of positions and marks, so the
     table is the interface and everything else is marginalia: rules instead of
     cards, tabular figures, one ink for text and one for the marks that mean
     something. Sharp corners, no shadows, no decoration that is not data. */
  :root {
    --ink: #14171b;
    --muted: #59606a;
    --faint: #8b929b;
    --rule: #d8dce0;
    --paper: #ffffff;
    --wash: #f6f7f8;
    --accent: #8a1f2d;
    --apply: #17603f;
    --ask: #8a5a12;
    --exclude: #6b7280;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 14px/1.55 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .masthead { border-bottom: 1px solid var(--ink); padding: 18px 0 0; }
  .masthead .inner {
    max-width: 1120px; margin: 0 auto; padding: 0 32px;
    display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap;
  }
  .wordmark {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 24px; font-weight: 600; letter-spacing: -.015em; color: var(--ink);
  }
  .wordmark:hover { text-decoration: none; }
  .masthead nav { display: flex; gap: 18px; margin-left: auto; align-items: baseline; }
  .masthead nav a { color: var(--ink); padding-bottom: 16px; border-bottom: 2px solid transparent; }
  .masthead nav a:hover { text-decoration: none; border-bottom-color: var(--rule); }
  .masthead nav a.active { border-bottom-color: var(--accent); }
  .today { color: var(--faint); font-size: 12.5px; }

  .strip { border-bottom: 1px solid var(--rule); background: var(--paper); }
  .strip .inner {
    max-width: 1120px; margin: 0 auto; padding: 7px 32px;
    display: flex; gap: 22px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap;
  }
  .strip b { color: var(--ink); font-weight: 600; }

  main { max-width: 1120px; margin: 0 auto; padding: 34px 32px 90px; }
  h1, h2 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 600; letter-spacing: -.012em;
  }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 10px; max-width: 34ch; }
  h2 { font-size: 18px; margin: 34px 0 10px; padding-top: 10px; border-top: 1px solid var(--ink); }
  .sub { color: var(--muted); margin: 0 0 26px; max-width: 72ch; }
  .lede {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 21px; line-height: 1.42; margin: 0 0 28px; max-width: 52ch;
  }
  .lede em { font-style: normal; color: var(--accent); }

  /* The stat strip is a line of figures, not six cards. */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 14px 26px; margin: 0 0 10px; padding: 0 0 4px;
  }
  .card { padding: 0; border: 0; min-width: 108px; }
  .card .k { font-size: 12.5px; color: var(--muted); }
  .card .v {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 26px; line-height: 1.15; margin-top: 1px;
  }
  .card .n { font-size: 12px; color: var(--faint); }

  .panel { border-top: 1px solid var(--rule); padding: 14px 0 4px; margin: 0 0 18px; }
  .panel:first-child { border-top: 0; }

  table { width: 100%; border-collapse: collapse; margin: 0 0 6px; }
  th, td {
    text-align: left; padding: 8px 12px 8px 0; vertical-align: baseline;
    border-bottom: 1px solid var(--rule);
  }
  th {
    font-size: 12px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--ink); padding-bottom: 6px;
  }
  th:last-child, td:last-child { padding-right: 0; }
  tbody tr:hover td { background: var(--wash); }

  .pill {
    display: inline-block; padding: 0 6px; font-size: 11.5px; font-weight: 600;
    border: 1px solid currentColor; border-radius: 2px; line-height: 1.5;
  }
  .pill.apply { color: var(--apply); }
  .pill.ask { color: var(--ask); }
  .pill.exclude { color: var(--exclude); }
  .pill.stage { color: var(--muted); }

  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .small { font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; }

  input, select, textarea, button {
    font: inherit; color: var(--ink); background: var(--paper);
    padding: 6px 9px; border: 1px solid #c8ced5; border-radius: 2px;
  }
  textarea { width: 100%; min-height: 78px; resize: vertical; }
  button { background: var(--ink); border-color: var(--ink); color: #fff; cursor: pointer; }
  button:hover { background: #262b31; }
  button.ghost { background: var(--paper); color: var(--ink); border-color: #c8ced5; }
  button.ghost:hover { background: var(--wash); }
  button.danger { background: var(--accent); border-color: var(--accent); }
  form.inline { display: inline; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 34px; }
  .kv { display: grid; grid-template-columns: 112px 1fr; gap: 4px 16px; font-size: 13px; }
  .kv .k { color: var(--muted); }

  pre.body {
    white-space: pre-wrap; background: var(--wash); border-left: 2px solid var(--rule);
    padding: 16px 20px; font-family: inherit; font-size: 13.5px; line-height: 1.62;
    max-height: 540px; overflow: auto; max-width: 46em;
  }

  .empty { color: var(--faint); padding: 12px 0; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { border-left: 1px solid var(--rule); padding: 0 0 14px 14px; position: relative; }
  .timeline li:before {
    content: ""; position: absolute; left: -3px; top: 7px;
    width: 5px; height: 5px; background: var(--accent);
  }
  .bar { height: 3px; background: #e6e9ec; width: 62px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  td.num { white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 1060px) { .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 720px) {
    .masthead .inner, .strip .inner, main { padding-left: 18px; padding-right: 18px; }
    .masthead nav { margin-left: 0; width: 100%; gap: 14px; overflow-x: auto; }
    .masthead nav a { padding-bottom: 10px; white-space: nowrap; }
    h1 { font-size: 25px; }
    .grid2 { gap: 20px; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="inner">
    <a class="wordmark" href="{{ url_for('overview') }}">Jobhunter</a>
    <nav>
      <a href="{{ url_for('overview') }}" class="{{ 'active' if request.endpoint == 'overview' }}">Overview</a>
      <a href="{{ url_for('jobs') }}" class="{{ 'active' if request.endpoint in ('jobs','job') }}">Postings</a>
      <a href="{{ url_for('applications') }}" class="{{ 'active' if request.endpoint in ('applications','application') }}">Applications</a>
      <a href="{{ url_for('outreach') }}" class="{{ 'active' if request.endpoint == 'outreach' }}">Outreach</a>
      <a href="{{ url_for('cvs_page') }}" class="{{ 'active' if request.endpoint == 'cvs_page' }}">CVs</a>
    </nav>
    <span class="today">{{ today }}</span>
  </div>
</header>
<div class="strip">
  <div class="inner">
    <span><b>{{ ready_count }}</b> ready to apply</span>
    <span><b>{{ open_count }}</b> applications open</span>
    <span><b>{{ total_count }}</b> postings tracked</span>
    {% if last_run %}<span class="faint">last read {{ last_run[:16].replace('T', ' ') }} UTC</span>{% endif %}
  </div>
</div>
<main>
  {% block body %}{% endblock %}
</main>
</body>
</html>
