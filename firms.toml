# --- Indeed, through a browser -------------------------------------------
#
# Off by default. Indeed answers 403 to plain HTTP and its publisher API is
# closed, but a real Chromium window loads the results page — so this drives one
# with Playwright. It is the only source here that reads a site which is actively
# trying not to be read, and Indeed's terms prohibit automated collection.
# Flip enabled to true if you want it; nothing else in the pipeline changes.
#
# Set headless = false to watch it work in a visible window.

[[firms]]
name = "Indeed UK"
ats = "indeed"
enabled = false
country = "uk"
where = "London"
pages = 1
fetch_details = false
keywords = [
  "investment analyst",
  "portfolio analyst",
  "investment risk analyst",
  "fund research analyst",
]

[[firms]]
name = "Indeed Australia"
ats = "indeed"
enabled = false
country = "au"
where = "All Australia"
pages = 1
fetch_details = false
keywords = [
  "investment analyst",
  "portfolio analyst",
  "investment risk analyst",
]

# --- JobSpy: Indeed, through a maintained library -------------------------
#
# github.com/speedyapply/JobSpy (MIT). This is the piece that reaches Indeed,
# and it also resolves the employer's own URL behind the advert, so a role found
# here and later seen on a Workday board is recognised as the same job.

[[firms]]
name = "JobSpy Indeed UK"
ats = "jobspy"
country = "uk"
where = "London"
results_wanted = 40
keywords = [
  "investment analyst",
  "portfolio analyst",
  "investment risk analyst",
  "fund research analyst",
  "performance analyst",
]

[[firms]]
name = "JobSpy Indeed Australia"
ats = "jobspy"
country = "au"
where = "Australia"
results_wanted = 40
keywords = [
  "investment analyst",
  "portfolio analyst",
  "investment risk analyst",
]

# --- Aggregators ----------------------------------------------------------
# Aggregators are worth having for breadth: they carry employers with no public
# board and small firms that never appear on one. They are worse per posting
# (stale copies, recruiters, duplicated adverts) which is why they are additive
# to the boards above rather than a replacement.
#
# Adzuna and Reed both need a free API key. Without one the source reports
# itself as unconfigured instead of quietly returning nothing.

[[firms]]
name = "Adzuna UK"
ats = "adzuna"
country = "uk"
pages = 2
keywords = [
  "investment analyst",
  "asset management graduate",
  "portfolio analyst",
  "investment risk analyst",
  "fund research analyst",
  "performance attribution analyst",
  "credit analyst",
]

[[firms]]
name = "Adzuna Australia"
ats = "adzuna"
country = "au"
pages = 2
keywords = [
  "investment analyst",
  "portfolio analyst",
  "investment risk analyst",
  "fund research analyst",
  "credit analyst",
]

[[firms]]
name = "Reed UK"
ats = "reed"
pages = 1
keywords = [
  "investment analyst",
  "portfolio analyst",
  "investment risk analyst",
  "fund research",
  "performance analyst",
  "credit analyst",
]

