# Employers whose own job boards can be read directly.
#
# Every entry here was checked by hand: the endpoint returned jobs. Add a firm by
# running `python -m jobhunter probe --domain example.com`, which looks at the
# firm's careers page, reads which applicant tracking system it uses, and prints
# the entry to paste below.
#
# ats = greenhouse | lever | workable | ashby | workday | seek
#
# Workday needs three parts, all visible in the careers URL:
#   https://{tenant}.{wd}.myworkdayjobs.com/{site}
#
# country is a hint only, used for grouping in the dashboard.

